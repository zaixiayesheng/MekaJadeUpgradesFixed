plugins {
    id 'java-library'
    // 1.20.1 的 Forge 用 ModDevGradle 的 legacyforge 插件（与 Ae2EmiQuickFill/1.20.1、
    // MekanismEmpoweredUnleashed/1.20.1-dev 同一套配方）
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    // 沿用 1.21.1 的产物名规则：mekajadeupgrades_fixed-<版本>.jar
    archivesName = mod_id
}

// 1.20.1 只认 JDK 17
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        create(mod_id) {
            sourceSet sourceSets.main
        }
    }
}

// Forge 1.20.1 的 mixin：MDG 生成 refmap，配置本身靠 jar 清单里的 MixinConfigs 挂上去
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    // 本地 maven 仓库：把 libs/ 里那几个 1.20.1 正式版 jar 包成模块坐标，
    // 这样才能用 modImplementation 引，让 MDG 在 dev 运行时替我们做 SRG↔Mojmap 重映射。
    // 目录由 libs/ 生成（不入版本控制），内容见 README 的「构建」一节。
    maven { url = uri('libs-maven') }
    mavenCentral()
    maven { url = uri('https://maven.neoforged.net/releases') }
}

// src/main/templates 里的 ${...} 在打包时展开（mods.toml / pack.mcmeta）。
// MDG 的 legacyforge 不会自动处理这个目录，必须自己接进来，否则 jar 里没有 mods.toml。
processResources {
    def replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            loader_version_range   : forge_version_range,
            forge_version_range    : forge_version_range,
            minecraft_version_range: minecraft_version_range,
            meka_version_range     : meka_version_range,
            jade_version_range     : jade_version_range,
            mekextras_version_range: mekextras_version_range,
            meu_version_range      : meu_version_range
    ]
    inputs.properties replaceProperties

    from('src/main/templates') {
        filteringCharset = 'UTF-8'
        expand replaceProperties
    }
}

dependencies {
    // 1.20.1 正式版 jar 是 SRG 名，dev 环境跑 Mojmap 名：必须走 modImplementation 的
    // 模块坐标，MDG 才会替我们重映射；直接 implementation fileTree 会在运行时抛
    // NoSuchMethodError（net.minecraft.Util.m_137492_）。所以这里改成从 libs-maven 取。
    modImplementation 'local.jade:jade:11.13.3'
    modImplementation 'local.mekanism:mekanism:10.4.16.80'
    modImplementation 'local.mekanism:mekanism_generators:10.4.16.80'
    modImplementation 'local.mekanism:mekanism_extras:1.5.0'
    modImplementation 'local.kotlinforforge:kotlinforforge:4.12.0'
    modImplementation 'local.meu:mekanism_empowered_unleashed:20.1-1.0.0'

    // mixin 注解处理器：MDG 的 mixin{} 靠它把注入点写成 refmap，
    // 少了这一步 build/mixin/ 是空的，reobfJar 会因为找不到 .mappings.tsrg 直接失败。
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
}
